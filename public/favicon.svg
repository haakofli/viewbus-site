<svg xmlns="http://www.w3.org/2000/svg" width="24" height="20" viewBox="0 0 24 20" fill="none" shape-rendering="geometricPrecision">
  <style>
    .ink-stroke { stroke: #0b0d10; }
    .ink-fill   { fill:   #0b0d10; }
    @media (prefers-color-scheme: dark) {
      .ink-stroke { stroke: #ffffff; }
      .ink-fill   { fill:   #ffffff; }
    }
  </style>
  <rect class="ink-stroke" x="2" y="2" width="20" height="12" rx="2" stroke-width="2" fill="none" />
  <rect x="14" y="5.5" width="5" height="5" fill="#3b82f6" />
  <circle class="ink-fill" cx="6" cy="16" r="2" />
  <circle class="ink-fill" cx="18" cy="16" r="2" />
</svg>
