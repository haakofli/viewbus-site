<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" shape-rendering="geometricPrecision">
  <style>
    .ink-stroke { stroke: #0b0d10; }
    .ink-fill   { fill:   #0b0d10; }
    @media (prefers-color-scheme: dark) {
      .ink-stroke { stroke: #ffffff; }
      .ink-fill   { fill:   #ffffff; }
    }
  </style>
  <rect class="ink-stroke" x="4" y="10" width="40" height="24" rx="4" stroke-width="4" fill="none" />
  <rect x="28" y="17" width="10" height="10" fill="#3b82f6" />
  <circle class="ink-fill" cx="12" cy="38" r="4" />
  <circle class="ink-fill" cx="36" cy="38" r="4" />
</svg>
